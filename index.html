        <h1 style="font-size: 26px; font-weight: bold; color: #b82e24; margin-bottom: 16px;">CS313 西班牙语研习社 · DELE / SIELE 全真机考与终身自学平台</h1>
        <p style="font-size: 15px; color: #475569; margin-bottom: 20px;">专注于西班牙塞万提斯学院官方 DELE 欧标考级（A1~C1）、SIELE 国际西班牙语评估测试、全国高校西班牙语专业四级（专四）以及全国名校考研二外西语的权威备考与自学系统。</p>

        <h2 style="font-size: 20px; font-weight: bold; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">一、 核心教研模块与功能体系</h2>
        
        <h3 style="font-size: 16px; font-weight: bold; color: #991b1b; margin-top: 16px;">1. 官方全真大考场与题型攻坚卷</h3>
        <p>1:1 还原机考作答界面。涵盖阅读理解（Comprensión de lectura）、语言运用与听力理解。内置倒计时时钟与标准涂卡答题卡，交卷后全自动判分，并提供长篇译文与详细考点逻辑推导。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #991b1b; margin-top: 16px;">2. 动词变位神器与“靴子法则”攻关</h3>
        <p>全面收录 1,000+ 高频动词全时态变形（-ar, -er, -ir）。直陈式现在时、简单过去时、过去未完成时、将来未完成时、条件式及虚拟式（Subjuntivo）全覆盖，图解不规则动词词干变化规律。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #991b1b; margin-top: 16px;">3. 27字母发音门诊与大舌音（R/RR）专项突破实验室</h3>
        <p>全音轨慢放西班牙本土卡斯蒂利亚标准发音。专项指导大舌颤音发音肌肉记忆训练技巧，攻克 b/v 浊辅音辨析与 c/z 咬舌音发音技巧。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #991b1b; margin-top: 16px;">4. 5,000+ 核心考纲词库与艾宾浩斯记忆（SRS）</h3>
        <p>覆盖专四、考研及 DELE A1~B2 全量大纲词汇。标注阴阳性词尾、重音规则符号（Tilde）、常用介词固定短语，支持艾宾浩斯智能打卡复习。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #991b1b; margin-top: 16px;">5. 《纸钞屋》《寻梦环游记》原声影视台词精析</h3>
        <p>原声视听双语切片，提炼拉美与西班牙本土地道口语俚语表达，支持逐句精听与原汁原味语料库沉淀。</p>

        <h2 style="font-size: 20px; font-weight: bold; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">二、 核心考点与题型大纲</h2>
        <ul style="padding-left: 20px; margin-top: 12px; color: #334155;">
          <li><strong>高频语法考点</strong>：Ser 与 Estar 的本质区别与形容词含义变化、双宾语代词（se lo / se la）置换规则、Por 与 Para 的逻辑辨析。</li>
          <li><strong>虚拟式专题突破</strong>：虚拟式现在时与过去未完成时在祈使句、主观评价句、条件状语从句与时间从句中的时态配合法则。</li>
          <li><strong>长篇读解与社科文化</strong>：掌握拉美历史文化、社会热点、科技环保题材的深层推论与篇章结构分析。</li>
        </ul>
